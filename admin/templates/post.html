{% extends "base.html" %}

{% block content %}
{% for message in get_flashed_messages() %}
    <div class="alert alert-warning alert-dismissible fade show" role="alert">
        {{ message }}
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
{% endfor %}

<div class="content-section">
    <form method="POST" action="{{ url_for('second.create_blog') }}">
        <fieldset class="form-group">
            <legend class="border-bottom mb-4"></legend>
             <h1>CREATE A BLOG</h1>
            <div class="form-group mb-3">
                <label for="title" class="form-control-label">Title</label>
                <input type="text" id="title" name="title" class="form-control form-control-lg">
                <!-- You can add error div if needed -->
                <!-- <div class="invalid-feedback">Error message here</div> -->
            </div>

            <div class="form-group mb-3">
                <label for="content" class="form-control-label">Content</label>
                <textarea id="content" name="content" class="form-control form-control-lg" rows="5"></textarea>
                <!-- <div class="invalid-feedback">Error message here</div> -->
            </div>

        </fieldset>

        <div class="form-group">
            <button type="submit" class="btn btn-outline-info">Submit</button>
        </div>
    </form>
</div>
{% endblock content %}
