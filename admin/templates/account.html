{% extends "base.html" %}
{% block content %}
<h1>Update Profile</h1>

<!-- {% for message in get_flashed_messages() %}
    <div class="alert alert-info">{{ message }}</div>
{% endfor %} -->

<form method="POST" action="{{ url_for('second.account') }}" enctype="multipart/form-data">
    <div class="mb-3">
        <label for="profile-image" class="form-label">Profile Image</label>
        {% if user.image %}
            <div>
                <img src="{{ url_for('static', filename='uploads/' ~ user.image) }}" 
                     alt="Profile Image" class="img-thumbnail mb-2" width="125">
            </div>
        {% endif %}
        <input type="file" class="form-control" id="profile-image" name="image">
    </div>

    <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" name="username" value="{{ user.name }}" required>
    </div>

    <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" required>
    </div>

    <button type="submit" class="btn btn-primary">Save Changes</button>
</form>

{% endblock content %}
