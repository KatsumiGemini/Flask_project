{% extends "base.html" %}
{% block content %}
<h1>JOIN TODAY </h1>

{% for message in get_flashed_messages() %}
    <div class="alert alert-warning alert-dismissible fade show" role="alert">
        {{ message }}
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
{% endfor %}

<form method="post" action="{{ url_for('second.register') }}">
    <input type="text" class="form-control" name="username" placeholder="Username" required>
    <br>
    <input type="email" class="form-control" name="email" placeholder="Email" required>
    <br>
    <select class="form-control" name="role" id="role" style="appearance: auto; -webkit-appearance: auto; -moz-appearance: auto;" required>
        <option value="" disabled selected>Select a role</option>
        <option value="1">Admin</option>
        <option value="2">User</option>
        <option value="3">Staff</option>
    </select>
    <br>
    <input type="password" class="form-control" name="password" placeholder="Password" required>
    <br>
    <input type="password" class="form-control" name="confirm_password" placeholder="Confirm Password" required>
    <br>
    <button type="submit" class="btn btn-outline-info mt-3">Register</button>
</form>
{% endblock content %}
